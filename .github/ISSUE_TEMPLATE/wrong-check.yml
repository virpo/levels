name: My result looks wrong
description: The agent missed something you do, or counted something you don't
title: "Check: "
labels: [check]
body:
  - type: markdown
    attributes:
      value: Please don't paste your result link or what your agent noticed. They describe your machine and stay yours.
  - type: input
    id: level
    attributes:
      label: Which level
      placeholder: "51. Have a fresh agent review the diff"
    validations:
      required: true
  - type: dropdown
    id: way
    attributes:
      label: What happened
      options:
        - I do it, but it wasn't found
        - It was found, but I don't do it
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Which agent ran the check
      placeholder: Claude Code, Codex, Cursor...
  - type: textarea
    id: how
    attributes:
      label: How you do it
      description: Enough for the check to find it next time, without anything private.
